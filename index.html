<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한눈팔기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stage" id="stage">
    <header class="status" id="status">
      <time class="status-date" id="live-date" datetime="">YYYY/MM/DD DAY</time>
      <time class="status-time" id="live-time" datetime="">0:00:00 AM</time>
    </header>

    <nav class="dock" id="dock" aria-label="Dock">
      <div class="dock-row">
        <a class="dock-item" id="dock-email" href="mailto:sommsomaj@gmail.com" aria-label="Email" title="Email">
          <img src="assets/icons/dock/email.svg?v=20261025" alt="" draggable="false" />
        </a>
        <button class="dock-item" id="dock-memo" type="button" aria-label="Memo" title="Memo">
          <img src="assets/icons/dock/memo.svg" alt="" draggable="false" />
        </button>
        <button class="dock-item" id="dock-music" type="button" aria-label="Music" title="Music" aria-pressed="false">
          <img src="assets/icons/dock/music.svg?v=20261025" alt="" draggable="false" />
        </button>
        <a class="dock-item" id="dock-instagram" href="https://www.instagram.com/_sommsoma/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <img src="assets/icons/dock/instagram.svg?v=20261025e" alt="" draggable="false" />
        </a>
      </div>
    </nav>
    <!-- folders < photos < windows (desktop); separate artboard so folders stay under photos -->
    <div class="artboard folders-layer" id="folders-layer">
      <div class="folders" id="folders">
        <div class="folder" id="folder-cat" data-folder="cat" role="button" tabindex="0" aria-label="Cat folder">
          <img class="folder-icon" src="assets/icons/folders/cat.svg" alt="" draggable="false" />
          <span class="folder-label">Cat</span>
        </div>
        <div class="folder" id="folder-dog" data-folder="dog" role="button" tabindex="0" aria-label="Dog folder">
          <img class="folder-icon" src="assets/icons/folders/dog.png" alt="" draggable="false" />
          <span class="folder-label">Dog</span>
        </div>
      </div>
    </div>
    <div class="photos" id="photos" aria-label="Scattered photos"></div>
    <div class="artboard desktop" id="desktop">
      <aside class="memo-window" id="memo-window" hidden aria-label="Memo">
        <div class="memo-sidebar" id="memo-titlebar">
          <button class="memo-close" id="memo-close" type="button" aria-label="Close memo">
            <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
              <path d="M2 2 L10 10 M10 2 L2 10" fill="none" stroke="#4C4C4C" stroke-width="0.85" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="memo-new" id="memo-new" type="button" aria-label="New memo" title="새로운 메모">
            <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
              <path d="M6 1.5 V10.5 M1.5 6 H10.5" fill="none" stroke="#4C4C4C" stroke-width="0.85" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="memo-sidebar-list" id="memo-sidebar-list"></div>
        </div>
        <div class="memo-frame">
          <textarea class="memo-body" id="memo-body" spellcheck="true"></textarea>
        </div>
      </aside>

      <aside class="folder-window" id="folder-window" hidden aria-label="Folder window">
        <div class="folder-window-chrome">
          <div class="folder-window-titlebar">
            <button class="folder-window-x" id="folder-window-close" type="button" aria-label="Close folder">
              <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                <path d="M2 2 L10 10 M10 2 L2 10" fill="none" stroke="#4C4C4C" stroke-width="0.85" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="folder-traffic" hidden aria-hidden="true">
              <button class="traffic traffic-close" type="button" tabindex="-1"></button>
              <button class="traffic traffic-minimize" type="button" tabindex="-1"></button>
              <button class="traffic traffic-fullscreen" type="button" tabindex="-1"></button>
            </div>
            <span class="folder-window-title" id="folder-window-title">Cat</span>
          </div>
          <div class="folder-window-body">
            <div class="folder-window-grid" id="folder-window-grid"></div>
          </div>
        </div>
      </aside>

      <aside class="folder-window photo-viewer" id="photo-viewer" hidden aria-label="Photo viewer">
        <div class="folder-window-chrome">
          <div class="folder-window-titlebar">
            <button class="folder-window-x" id="photo-viewer-close" type="button" aria-label="Close photo">
              <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                <path d="M2 2 L10 10 M10 2 L2 10" fill="none" stroke="#4C4C4C" stroke-width="0.85" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="folder-window-title" id="photo-viewer-title">Photo</span>
          </div>
          <div class="folder-window-body photo-viewer-body">
            <button class="photo-viewer-nav photo-viewer-prev" id="photo-viewer-prev" type="button" aria-label="Previous photo">
              <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                <path d="M11.5 3.5 L6 9 L11.5 14.5" fill="none" stroke="#4C4C4C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <img class="photo-viewer-img" id="photo-viewer-img" alt="" draggable="false" />
            <button class="photo-viewer-nav photo-viewer-next" id="photo-viewer-next" type="button" aria-label="Next photo">
              <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                <path d="M6.5 3.5 L12 9 L6.5 14.5" fill="none" stroke="#4C4C4C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <audio id="bg-music" loop preload="metadata" src="assets/music/Good%20Graces.mp3"></audio>

  <script src="js/photos-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
